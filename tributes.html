<section class="page-header">
    <h1>Tribute Wall</h1>
    <p>Share a message in remembrance</p>
</section>

<section class="tribute-section">

    <form id="tributeForm">
        <input type="text" id="name"
               placeholder="Your name" required>

        <textarea id="message"
                  placeholder="Write your tribute..."
                  required></textarea>

        <button type="submit" class="btn">
            Post Tribute
        </button>
    </form>

    <div id="tributeList" class="tribute-list"></div>

</section>

<footer>
    <p>Rest in Peace, Raila Amolo Odinga.</p>
</footer>
